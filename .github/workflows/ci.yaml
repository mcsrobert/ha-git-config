name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements-test.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  action:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check and build the fixture configuration
        uses: $/
        with:
          # renovate: datasource=pypi depName=homeassistant
          home-assistant-version: 2026.10.4
          path: tests/fixtures/config
